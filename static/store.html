    // ---- 图片预览手势：双指缩放 + 单指平移（放大后）+ 双击在 1x/2.5x 间切换 ----
    const ZOOM_MAX = 8, ZOOM_DOUBLE_TAP = 2.5, DOUBLE_TAP_MS = 300;
    const zoomState = {
        pointers: new Map(), scale: 1, tx: 0, ty: 0,
        startDist: 0, startScale: 1, centerStart: null, panStart: null, lastTap: 0
    };

    function clampZoom(v) { return Math.min(ZOOM_MAX, Math.max(1, v)); }

    function applyPreviewZoom() {
        const img = document.getElementById('previewImg');
        if (!img) return;
        img.style.transform = `translate(${zoomState.tx}px, ${zoomState.ty}px) scale(${zoomState.scale})`;
    }

    function resetPreviewZoom() {
        zoomState.scale = 1;
        zoomState.tx = 0;
        zoomState.ty = 0;
        zoomState.panStart = null;
        zoomState.centerStart = null;
        applyPreviewZoom();
    }

    /** 缩放到 target 并让视口坐标 (cx,cy) 处的内容点保持在原位。 */
    function zoomAt(target, cx, cy) {
        target = clampZoom(target);
        if (target === zoomState.scale) return;
        const centerX = window.innerWidth / 2, centerY = window.innerHeight / 2;
        // 内容点相对图片中心的无缩放偏移 = ((视口点-屏幕中心) - 当前平移) / 当前缩放
        const px = ((cx - centerX) - zoomState.tx) / zoomState.scale;
        const py = ((cy - centerY) - zoomState.ty) / zoomState.scale;
        zoomState.tx = (cx - centerX) - target * px;
        zoomState.ty = (cy - centerY) - target * py;
        zoomState.scale = target;
        if (zoomState.scale <= 1.01) {
            zoomState.scale = 1; zoomState.tx = 0; zoomState.ty = 0;
        }
        applyPreviewZoom();
    }

    function bindPreviewZoom() {
        const img = document.getElementById('previewImg');
        if (!img) return;
        img.addEventListener('pointerdown', e => {
            img.setPointerCapture(e.pointerId);
            zoomState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (zoomState.pointers.size === 1) {
                zoomState.panStart = { x: e.clientX, y: e.clientY, tx: zoomState.tx, ty: zoomState.ty };
                const now = Date.now();
                if (now - zoomState.lastTap < DOUBLE_TAP_MS) {
                    // 双击：已放大则复位,否则放大到该点
                    zoomAt(zoomState.scale > 1 ? 1 : ZOOM_DOUBLE_TAP, e.clientX, e.clientY);
                    zoomState.lastTap = 0;
                } else {
                    zoomState.lastTap = now;
                }
            } else if (zoomState.pointers.size === 2) {
                const pts = [...zoomState.pointers.values()];
                zoomState.startDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
                zoomState.startScale = zoomState.scale;
                zoomState.centerStart = {
                    x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2,
                    tx: zoomState.tx, ty: zoomState.ty
                };
                zoomState.panStart = null;
            }
            e.preventDefault();
        });
        img.addEventListener('pointermove', e => {
            if (!zoomState.pointers.has(e.pointerId)) return;
            zoomState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (zoomState.pointers.size === 2 && zoomState.centerStart) {
                const pts = [...zoomState.pointers.values()];
                const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                zoomState.scale = clampZoom(zoomState.startScale * dist / zoomState.startDist);
                // 双指中心移动同时平移
                zoomState.tx = zoomState.centerStart.tx + (pts[0].x + pts[1].x) / 2 - zoomState.centerStart.x;
                zoomState.ty = zoomState.centerStart.ty + (pts[0].y + pts[1].y) / 2 - zoomState.centerStart.y;
                applyPreviewZoom();
            } else if (zoomState.pointers.size === 1 && zoomState.panStart && zoomState.scale > 1) {
                zoomState.tx = zoomState.panStart.tx + (e.clientX - zoomState.panStart.x);
                zoomState.ty = zoomState.panStart.ty + (e.clientY - zoomState.panStart.y);
                applyPreviewZoom();
            }
        });
        const release = e => {
            zoomState.pointers.delete(e.pointerId);
            if (zoomState.pointers.size < 2) zoomState.centerStart = null;
            if (zoomState.pointers.size === 0) zoomState.panStart = null;
            // 缩放回到接近 1x 时归位,避免残留 1.02 倍的怪异状态
            if (zoomState.pointers.size === 0 && zoomState.scale <= 1.01) resetPreviewZoom();
        };
        img.addEventListener('pointerup', release);
        img.addEventListener('pointercancel', release);
    }

    // ---- 下载令牌：移动端 WebView 会把下载转交系统下载器，该请求不携带 Cookie，
    // 后端虽支持 ?token= 认证，但令牌存于 HttpOnly Cookie 里页面读不到，
    // 因此登录时另存一份到 localStorage，下载 URL 统一经 withToken 附加。 ----
    const TOKEN_KEY = 'toolan_token';

    function withToken(url) {
        const token = localStorage.getItem(TOKEN_KEY);
        if (!token) return url;
        return url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token);
    }

    // ---- 加密模式媒体访问：把 /static 直链换成加密下载端点，解密成 blob URL ----
    // 明文模式全部原样返回，行为与旧版一致。
    const blobUrlCache = new Map();

    function cryptoActive() {
        return !!(window.ToolanA1 && ToolanA1.isActive());
    }

    function encryptedMediaUrl(item) {
        const m = (item.url || '').match(/^\/static\/(files|images)\/(.+)$/);
        if (m) return ToolanA1.downloadUrl(m[1] === 'images' ? 'image' : 'file', m[2]);
        return item.url; // zip 条目等已是 API 地址，按原样加密请求
    }

    function fetchMediaBlob(item) {
        if (!cryptoActive()) return fetch(item.url).then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.blob();
        });
        return fetch(encryptedMediaUrl(item), { headers: { 'X-Toolan-Crypto': ToolanA1.VERSION } })
            .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return ToolanA1.decryptStream(res);
            })
            .then(r => {
                const type = (r.meta && r.meta.mime) || '';
                return type ? new Blob([r.blob], { type: type }) : r.blob;
            });
    }

    /** 解析出可直接给 img/video/audio/iframe 用的地址；加密模式返回 blob URL（带缓存）。 */
    function resolveMediaUrl(item) {
        if (!cryptoActive()) return Promise.resolve(item.url);
        const key = item.url;
        if (blobUrlCache.has(key)) return Promise.resolve(blobUrlCache.get(key));
        return fetchMediaBlob(item)
            .then(blob => {
                const url = URL.createObjectURL(blob);
                blobUrlCache.set(key, url);
                return url;
            })
            .catch(err => {
                console.warn('媒体解密失败，回退明文地址', err);
                return item.url;
            });
    }

    function revokeMediaUrls() {
        for (const url of blobUrlCache.values()) URL.revokeObjectURL(url);
        blobUrlCache.clear();
    }

    // localStorage 里没有令牌（登录发生在旧版本上）则向服务端要一份：Cookie 仍有效即可无感补齐。
    let tokenPromise = null;
    function ensureToken() {
        if (localStorage.getItem(TOKEN_KEY)) return Promise.resolve();
        if (!tokenPromise) {
            tokenPromise = fetch('/api/auth/token')
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (data && data.token) localStorage.setItem(TOKEN_KEY, data.token);
                })
                .catch(() => {}) // 拉取失败退回纯 Cookie 下载（桌面浏览器仍可用）
                .finally(() => { tokenPromise = null; });
        }
        return tokenPromise;
    }

    async function downloadOne(item) {
        await ensureToken();
        // 加密模式：优先原生桥下载（App 内解密落盘），否则 fetch + A1L 解密 + blob 保存
        if (cryptoActive()) {
            try {
                await ToolanA1.downloadEncrypted(withToken(encryptedMediaUrl(item)), item.name);
                return;
            } catch (err) {
                toast('下载', '加密下载失败：' + err.message);
                return;
            }
        }
        const a = document.createElement('a');
        a.href = withToken(item.url);
        a.download = item.name;
        a.click();
    }

    // 分享仓库文件到微信/QQ 等其它应用（App 内经 ToolanShare 原生桥执行，
    // 下载地址构造与加密下载同路：加密走 /api/download 流，明文走 /static 直链）
    async function shareFile(item) {
        if (!window.ToolanShare) {
            toast('分享', '分享仅在手机 App 内可用');
            return;
        }
        await ensureToken();
        const url = cryptoActive() ? withToken(encryptedMediaUrl(item)) : withToken(item.url);
        window.ToolanShare.shareFile(url, item.name);
    }

    // ---- 压缩包内容预览：后端把 zip 内条目解压后按 inline 流式返回，前端复用现有预览弹窗 ----
    const IMG_EXT = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp', 'avif'];
    const VID_EXT = ['mp4', 'webm', 'ogv', 'mov', 'm4v', 'mkv'];
    const AUD_EXT = ['mp3', 'wav', 'flac', 'aac', 'm4a', 'ogg', 'oga', 'opus', 'weba', 'aiff', 'aif', 'alac'];

    function extToMediaType(ext) {
        if (IMG_EXT.includes(ext)) return 'image';
        if (VID_EXT.includes(ext)) return 'video';
        if (AUD_EXT.includes(ext)) return 'audio';
        return 'file';
    }

    function entryPreviewable(ext) {
        return extToMediaType(ext) !== 'file' || INLINE_DOCS.includes(ext) || OFFICE_DOCS.includes(ext);
    }

    function iconForEntry(ext) {
        if (ext === 'docx') return '📃';
        if (ext === 'xlsx') return '📊';
        if (ext === 'pptx') return '📽️';
        const t = extToMediaType(ext);
        if (t === 'image') return '🖼️';
        if (t === 'video') return '🎬';
        if (t === 'audio') return '🎵';
        if (INLINE_DOCS.includes(ext)) return '📄';
        return '📦';
    }

    function zipEntryURL(item, entryName) {
        return '/api/zip/file?' + new URLSearchParams({ type: state.tab, path: item.path, entry: entryName }).toString();
    }

    function downloadZipEntry(item, entryName, name) {
        ensureToken().then(() => {
            if (cryptoActive()) {
                ToolanA1.downloadEncrypted(withToken(zipEntryURL(item, entryName)), name)
                    .catch(err => toast('下载', '加密下载失败：' + err.message));
                return;
            }
            const a = document.createElement('a');
            a.href = withToken(zipEntryURL(item, entryName));
            a.download = name;
            a.click();
        });
    }

    // 激活压缩包内某个条目：可预览则复用现有预览弹窗，否则直接下载；嵌套 zip 仅支持下载。
    function activateZipEntry(item, entryName) {
        const name = entryName.split('/').pop() || entryName;
        const ext = (name.split('.').pop() || '').toLowerCase();
        if (ext === 'zip' || !entryPreviewable(ext)) return downloadZipEntry(item, entryName, name);
        openFile({ name: name, ext: ext, url: zipEntryURL(item, entryName), mediaType: extToMediaType(ext) });
    }

    async function openZipBrowser(item) {
        const wrap = document.createElement('div');
        wrap.className = 'zip-browser';
        const tip = document.createElement('div');
        tip.className = 'zip-tip';
        tip.textContent = '正在读取压缩包…';
        const list = document.createElement('div');
        list.className = 'zip-list';
        wrap.append(tip, list);

        let layer;
        const footer = makeModalActions([{ label: '关闭', onClick: () => layer.finish(false) }]);
        layer = openModalLayer({ title: '压缩包：' + item.name, body: wrap, footer });

        let entries = [];
        try {
            const res = await fetch('/api/zip/entries?' + new URLSearchParams({ type: state.tab, path: item.path }).toString());
            const data = await res.json();
            if (!res.ok) { tip.textContent = data.error || '读取压缩包失败'; return; }
            entries = data.entries || [];
        } catch (err) {
            tip.textContent = '读取压缩包失败';
            return;
        }

        if (!entries.length) { tip.textContent = '压缩包为空，或不含可显示的文件'; return; }
        tip.textContent = `共 ${entries.length} 个文件 · 点击一行预览，不支持的类型将直接下载`;

        entries.forEach(entry => {
            const name = entry.name.split('/').pop() || entry.name;
            const ext = (name.split('.').pop() || '').toLowerCase();
            const row = document.createElement('div');
            row.className = 'zip-row';
            const icon = document.createElement('span'); icon.className = 'zip-icon'; icon.textContent = iconForEntry(ext);
            const label = document.createElement('span'); label.className = 'zip-name'; label.textContent = entry.name; label.title = entry.name;
            const size = document.createElement('span'); size.className = 'zip-size'; size.textContent = humanSize(entry.size);
            const act = document.createElement('button'); act.type = 'button'; act.className = 'zip-open';
            act.textContent = (ext !== 'zip' && entryPreviewable(ext)) ? '预览' : '下载';
            act.addEventListener('click', ev => { ev.stopPropagation(); activateZipEntry(item, entry.name); });
            row.append(icon, label, size, act);
            row.addEventListener('click', () => activateZipEntry(item, entry.name));
            list.appendChild(row);
        });
    }

    let remindersReqSeq = 0;
    async function loadReminders() {
        // 序号防乱序:路由恢复可能连续触发两次,只让最后一次请求的结果生效
        const seq = ++remindersReqSeq;
        const res = await fetch('/api/reminders?includeDone=' + state.includeDone);
        if (seq !== remindersReqSeq) return;
        const data = await res.json();
        state.reminders = data.list || [];
        renderCalendar();
        renderSelectedDateReminders();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        document.getElementById('calendarTitle').textContent =
            `${state.calendarMonth.getFullYear()}年 ${state.calendarMonth.getMonth() + 1}月`;

        const eventDates = new Set(state.reminders.map(item => dateKey(new Date(item.remindAt))));
        const todayKey = dateKey(new Date());
        const year = state.calendarMonth.getFullYear();
        const month = state.calendarMonth.getMonth();
        const firstDay = new Date(year, month, 1);
        const startOffset = (firstDay.getDay() + 6) % 7;
        const start = new Date(year, month, 1 - startOffset);

        for (let i = 0; i < 42; i++) {
            const day = new Date(start);
            day.setDate(start.getDate() + i);
            const key = dateKey(day);
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'calendar-day';
            if (day.getMonth() !== month) btn.classList.add('is-muted');
            if (eventDates.has(key)) btn.classList.add('has-events');
            if (key === todayKey) btn.classList.add('is-today');
            if (key === dateKey(state.selectedDate)) btn.classList.add('is-selected');
            btn.textContent = String(day.getDate());
            btn.addEventListener('click', () => selectCalendarDate(day));
            grid.appendChild(btn);
        }
    }

    function renderSelectedDateReminders() {
        const list = document.getElementById('reminderList');
        list.innerHTML = '';
        const selectedKey = dateKey(state.selectedDate);
        document.getElementById('selectedDateLabel').textContent = formatDateLabel(state.selectedDate);

        const reminders = state.reminders
            .filter(item => dateKey(new Date(item.remindAt)) === selectedKey)
            .sort((a, b) => new Date(a.remindAt) - new Date(b.remindAt));

        if (reminders.length === 0) {
            list.appendChild(emptyNode());
            return;
        }

        reminders.forEach(item => {
            const card = document.createElement('div');
            card.className = 'row-card' + (item.done ? ' done' : '');
            const top = document.createElement('div');
            top.className = 'row-top';
            const title = document.createElement('div');
            title.className = 'row-title';
            title.textContent = item.title || '提醒';
            const ops = document.createElement('div');
            const done = document.createElement('button');
            done.textContent = item.done ? '恢复' : '完成';
            done.addEventListener('click', () => setReminderDone(item.id, !item.done));
            const del = document.createElement('button');
            del.className = 'danger';
            del.textContent = '删除';
            del.addEventListener('click', () => deleteReminder(item.id));
            ops.append(done, del);
            top.append(title, ops);
            card.appendChild(top);
            appendText(card, 'meta', formatTime(item.remindAt));
            appendText(card, 'row-content', item.content || '');
            list.appendChild(card);
        });
    }

    function selectCalendarDate(date, fromRoute) {
        state.selectedDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        state.calendarMonth = new Date(date.getFullYear(), date.getMonth(), 1);
        renderCalendar();
        renderSelectedDateReminders();
        if (!fromRoute) pushRoute();
    }

    function changeCalendarMonth(offset, fromRoute) {
        state.calendarMonth = new Date(
            state.calendarMonth.getFullYear(),
            state.calendarMonth.getMonth() + offset,
            1
        );
        renderCalendar();
        if (!fromRoute) pushRoute();
    }

    function selectToday() {
        selectCalendarDate(new Date());
    }

    async function addReminder() {
        const title = document.getElementById('reminderTitle').value.trim();
        const content = document.getElementById('reminderContent').value.trim();
        const time = document.getElementById('reminderTime').value || '09:00';
        const remindAt = `${dateKey(state.selectedDate)}T${time}`;
        if (!title && !content) return toast('日期提醒', '标题或内容不能为空');
        const res = await fetch('/api/reminders', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title, content, remindAt})
        });
        if (res.ok) {
            document.getElementById('reminderTitle').value = '';
            document.getElementById('reminderContent').value = '';
            loadReminders();
        }
    }

    async function setReminderDone(id, done) {
        await fetch('/api/reminders/' + id, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({done})
        });
        loadReminders();
    }

    async function deleteReminder(id) {
        if (!(await confirmDialog('删除这条提醒？此操作不可恢复。', { title: '删除提醒', danger: true, okText: '删除' }))) return;
        await fetch('/api/reminders/' + id, {method: 'DELETE'});
        loadReminders();
    }

    function toggleDone(fromRoute) {
        state.includeDone = !state.includeDone;
        document.getElementById('toggleDoneBtn').textContent = state.includeDone ? '隐藏已完成' : '显示已完成';
        loadReminders();
        if (!fromRoute) pushRoute();
    }

    async function loadMessages() {
        const res = await fetch('/messages');
        const data = await res.json();
        const list = document.getElementById('messageList');
        list.innerHTML = '';
        const messages = data.messages || [];
        if (messages.length === 0) {
            list.appendChild(emptyNode());
            return;
        }
        messages.slice().reverse().forEach((msg, idx) => {
            const originalIndex = messages.length - 1 - idx;
            const item = document.createElement('div');
            item.className = 'message-item';
            appendText(item, 'message-time', formatTime(msg.time));
            const card = document.createElement('div');
            card.className = 'row-card message-card';
            const top = document.createElement('div');
            top.className = 'row-top';
            appendText(top, 'row-title', msg.title || '消息');
            const del = document.createElement('button');
            del.className = 'message-close';
            del.type = 'button';
            del.textContent = '×';
            del.setAttribute('aria-label', '删除消息');
            del.title = '删除';
            del.addEventListener('click', () => deleteMessage(originalIndex));
            top.appendChild(del);
            card.appendChild(top);
            appendText(card, 'row-content', msg.content || '');
            item.appendChild(card);
            list.appendChild(item);
        });
    }

    async function sendMessage() {
        const title = document.getElementById('msgTitle').value.trim();
        const content = document.getElementById('msgContent').value.trim();
        if (!content) return toast('消息', '内容不能为空');
        const res = await fetch('/message', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title, content})
        });
        if (res.ok) {
            document.getElementById('msgTitle').value = '';
            document.getElementById('msgContent').value = '';
            loadMessages();
        }
    }

    async function deleteMessage(index) {
        if (!(await confirmDialog('删除这条消息？', { title: '删除消息', danger: true, okText: '删除' }))) return;
        await fetch('/message/' + index, {method: 'DELETE'});
        loadMessages();
    }

    async function loadClips() {
        const res = await fetch('/api/clipboard');
        const data = await res.json();
        renderClips(data.clips || []);
    }

    function renderClips(clips) {
        const list = document.getElementById('clipList');
        list.innerHTML = '';
        if (clips.length === 0) {
            list.appendChild(emptyNode());
            return;
        }
        clips.slice().reverse().forEach(clip => {
            const card = document.createElement('div');
            card.className = 'row-card';
            const top = document.createElement('div');
            top.className = 'row-top';
            appendText(top, 'meta', formatTime(clip.time));
            const ops = document.createElement('div');
            ops.style.display = 'flex';
            ops.style.gap = '8px';
            const copy = document.createElement('button');
            copy.textContent = '复制';
            copy.addEventListener('click', () => copyClip(clip.content));
            const del = document.createElement('button');
            del.className = 'danger';
            del.textContent = '删除';
            del.addEventListener('click', () => deleteClip(clip.id));
            ops.append(copy, del);
            top.append(ops);
            card.appendChild(top);
            const body = document.createElement('div');
            body.className = 'clip-content';
            body.textContent = clip.content;
            card.appendChild(body);
            list.appendChild(card);
        });
    }

    async function addClip() {
        const input = document.getElementById('clipInput');
        const content = input.value;
        if (!content.trim()) return toast('剪贴板', '内容不能为空');
        const res = await fetch('/api/clipboard', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content})
        });
        if (res.ok) {
            input.value = '';
            loadClips();
        }
    }

    // readClipboardIntoInput uses the async Clipboard API when available (secure context)
    // and otherwise hints the user to paste manually, since http://LAN blocks readText().
    async function readClipboardIntoInput() {
        const input = document.getElementById('clipInput');
        if (navigator.clipboard && navigator.clipboard.readText) {
            try {
                input.value = await navigator.clipboard.readText();
                input.focus();
                return;
            } catch (err) {
                toast('剪贴板', '浏览器未授权自动读取，请手动粘贴 (Ctrl/长按 V)');
            }
        } else {
            toast('剪贴板', '当前环境不支持自动读取，请手动粘贴 (Ctrl/长按 V)');
        }
        input.focus();
    }

    async function copyClip(content) {
        if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
            try {
                await navigator.clipboard.writeText(content);
                toast('剪贴板', '已复制');
                return;
            } catch (err) {}
        }
        // Fallback for insecure http context: select-and-copy via a hidden textarea.
        const ta = document.createElement('textarea');
        ta.value = content;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(ta);
        toast('剪贴板', ok ? '已复制' : '请长按/右键手动复制');
    }

    async function deleteClip(id) {
        if (!(await confirmDialog('删除这条剪贴板记录？', { title: '删除记录', danger: true, okText: '删除' }))) return;
        await fetch('/api/clipboard/' + id, {method: 'DELETE'});
        loadClips();
    }

    async function clearClips() {
        if (!(await confirmDialog('清空所有共享剪贴板记录？所有设备将不再看到历史。', { title: '清空剪贴板', danger: true, okText: '清空' }))) return;
        await fetch('/api/clipboard', {method: 'DELETE'});
        loadClips();
    }

    // WS 事件分发：数据可能是明文 JSON 或（加密通道下）解密后的明文
    function handleWsEvent(text) {
        try {
            const data = JSON.parse(text);
            const payload = data.payload || {};
            if (data.type === 'message' || data.type === 'notification') {
                toast(payload.title || '消息', payload.content || '');
                if (state.tab === 'message') loadMessages();
            }
            if (data.type && data.type.startsWith('reminder.')) {
                toast(payload.title || '日期提醒', payload.content || formatTime(payload.remindAt));
                if (state.tab === 'reminder') loadReminders();
            }
            if (data.type === 'clipboard') {
                toast('剪贴板', '收到新的共享内容');
                if (state.tab === 'clipboard') loadClips();
            }
            if (data.type === 'clipboard.deleted' || data.type === 'clipboard.cleared') {
                if (state.tab === 'clipboard') loadClips();
            }
        } catch (err) {}
    }

    function connectWebSocket() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsHref = window.ToolanA1
            ? ToolanA1.wsUrl(protocol + '//' + location.host + '/ws')
            : protocol + '//' + location.host + '/ws';
        const socket = new WebSocket(wsHref);
        socket.onmessage = event => {
            // 加密通道：先解信封再解析；解密失败静默丢弃本条
            const deliver = window.ToolanA1
                ? ToolanA1.decryptMessage(event.data)
                : Promise.resolve(event.data);
            deliver.then(data => {
                handleWsEvent(data);
            }).catch(() => {});
        };
        // 会话失效（如服务端更换会话密钥后令牌全部作废）时服务端对 /ws 返回 401，
        // 盲目重连只会每 3 秒刷一条 401：先探测会话，未登录则跳登录页，可达则照常重连。
        socket.onclose = () => setTimeout(async () => {
            try {
                const res = await fetch('/api/auth/status');
                const s = await res.json();
                if (!s || !s.authenticated) {
                    location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search);
                    return;
                }
            } catch (err) { /* 探测失败（服务暂不可达）照常重连 */ }
            connectWebSocket();
        }, 3000);
    }

    function infoNode(item) {
        const box = document.createElement('div');
        box.className = 'item-info';
        appendText(box, 'name', item.name);
        const meta = document.createElement('div');
        meta.className = 'meta';
        appendText(meta, '', humanSize(item.size));
        appendText(meta, '', labelForCategory(item.category));
        box.appendChild(meta);
        appendText(box, 'meta', formatTime(item.createdAt));
        const ren = document.createElement('button');
        ren.type = 'button';
        ren.className = 'inline-rename';
        ren.textContent = '✎ 重命名';
        ren.addEventListener('click', ev => { ev.stopPropagation(); renameFile(item); });
        box.appendChild(ren);
        return box;
    }

    function appendCell(row, text) {
        const td = document.createElement('td');
        td.textContent = text;
        row.appendChild(td);
    }

    function appendText(parent, className, text) {
        const node = document.createElement('div');
        if (className) node.className = className;
        node.textContent = text;
        parent.appendChild(node);
        return node;
    }

    function emptyNode() {
        const div = document.createElement('div');
        div.className = 'empty';
        div.textContent = '暂无数据';
        return div;
    }

    function toast(title, content) {
        const wrap = document.getElementById('toast');
        const node = document.createElement('div');
        node.className = 'toast-item';
        appendText(node, 'toast-title', title);
        appendText(node, '', content);
        wrap.appendChild(node);
        setTimeout(() => node.remove(), 4200);
    }

    // ---- 通用弹窗内核（替代 alert / confirm / prompt）----
    // 每次打开都会新建一个覆盖层，支持叠加（如文件夹选择器里再弹「新建文件夹」）。
    const modalStack = [];

    function openModalLayer({ title = '', body = '', footer = null, onClose }) {
        const root = document.createElement('div');
        root.className = 'modal';

        const mask = document.createElement('div');
        mask.className = 'modal-mask';

        const box = document.createElement('div');
        box.className = 'modal-box';

        const head = document.createElement('div');
        head.className = 'modal-head';
        const titleEl = document.createElement('span');
        titleEl.textContent = title;
        const closeX = document.createElement('button');
        closeX.type = 'button';
        closeX.className = 'modal-x';
        closeX.setAttribute('aria-label', '关闭');
        closeX.textContent = '×';
        head.append(titleEl, closeX);

        const bodyEl = document.createElement('div');
        bodyEl.className = 'modal-body';
        if (typeof body === 'string') bodyEl.textContent = body;
        else if (body) bodyEl.appendChild(body);

        const footEl = document.createElement('div');
        footEl.className = 'modal-foot';
        if (footer) footEl.appendChild(footer);

        box.append(head, bodyEl, footEl);
        root.append(mask, box);
        document.body.appendChild(root);
        requestAnimationFrame(() => root.classList.add('open'));
        // 模态记入历史:后退一次关闭一层
        history.pushState(null, '', '#modal');

        const ctx = {};
        let closed = false;
        function finish(result, fromRoute) {
            if (closed) return;
            closed = true;
            const idx = modalStack.indexOf(ctx);
            if (idx >= 0) modalStack.splice(idx, 1);
            root.classList.remove('open');
            document.removeEventListener('keydown', onKey, true);
            setTimeout(() => root.remove(), 180);
            // 用户手势关闭时把 #modal 那条历史退掉;popstate 触发的关闭不能再 back
            if (!fromRoute && location.hash === '#modal') history.back();
            if (onClose) onClose(result);
        }
        function onKey(e) {
            if (e.key !== 'Escape') return;
            if (previewOpen()) return; // 预览层叠在模态之上时,Esc 先交给预览层
            if (modalStack[modalStack.length - 1] !== ctx) return; // 只响应最上层弹窗
            e.preventDefault();
            finish(false);
        }
        document.addEventListener('keydown', onKey, true);
        closeX.addEventListener('click', () => finish(false));
        mask.addEventListener('click', () => finish(false));
        modalStack.push(ctx);

        return { finish };
    }

    function makeModalActions(buttons) {
        const row = document.createElement('div');
        row.className = 'modal-actions';
        buttons.forEach(cfg => {
            const btn = document.createElement('button');
            btn.type = 'button';
            if (cfg.cls) btn.className = cfg.cls;
            btn.textContent = cfg.label;
            btn.addEventListener('click', cfg.onClick);
            row.appendChild(btn);
        });
        return row;
    }

    function alertDialog(message, opts = {}) {
        const { title = '提示', okText = '知道了' } = opts;
        return new Promise(resolve => {
            const footer = makeModalActions([{ label: okText, cls: 'primary', onClick: () => layer.finish(true) }]);
            const layer = openModalLayer({ title, body: message, footer, onClose: () => resolve() });
        });
    }

    function confirmDialog(message, opts = {}) {
        const { title = '确认', okText = '确定', cancelText = '取消', danger = false } = opts;
        return new Promise(resolve => {
            const footer = makeModalActions([
                { label: cancelText, onClick: () => layer.finish(false) },
                { label: okText, cls: danger ? 'danger' : 'primary', onClick: () => layer.finish(true) }
            ]);
            const layer = openModalLayer({ title, body: message, footer, onClose: (r) => resolve(r === true) });
        });
    }

    function promptDialog(opts = {}) {
        const { title = '请输入', label = '', value = '', placeholder = '', okText = '确定', cancelText = '取消', validate } = opts;
        return new Promise(resolve => {
            const wrap = document.createElement('div');
            if (label) {
                const lab = document.createElement('div');
                lab.className = 'field-label';
                lab.textContent = label;
                wrap.appendChild(lab);
            }
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'prompt-input';
            input.value = value;
            input.placeholder = placeholder;
            wrap.appendChild(input);

            let layer;
            const submit = () => {
                const v = input.value.trim();
                input.classList.remove('invalid');
                if (validate) {
                    const err = validate(v);
                    if (err) { input.classList.add('invalid'); toast('提示', err); input.focus(); return; }
                }
                layer.finish(v); // 通过 onClose 回传字符串结果
            };
            input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });

            const footer = makeModalActions([
                { label: cancelText, onClick: () => layer.finish(false) },
                { label: okText, cls: 'primary', onClick: submit }
            ]);
            // 成功回传字符串，取消（含 Esc / 遮罩 / ×）回传 false → null。
            layer = openModalLayer({ title, body: wrap, footer, onClose: (r) => resolve(typeof r === 'string' ? r : null) });
            setTimeout(() => { input.focus(); input.select(); }, 60);
        });
    }

    // 文件夹选择器：自带层级浏览 + 就地新建。
    // 返回选中的目标路径（'' 表示根/未分类），取消返回 null。
    function folderPicker(opts = {}) {
        const { title = '移动到' } = opts;
        return new Promise(resolve => {
            let path = state.currentFolder || '';

            const wrap = document.createElement('div');
            wrap.className = 'folder-picker';
            const crumb = document.createElement('div');
            crumb.className = 'picker-crumb';
            const target = document.createElement('div');
            target.className = 'picker-target';
            const list = document.createElement('div');
            list.className = 'picker-list';
            const newBtn = document.createElement('button');
            newBtn.type = 'button';
            newBtn.className = 'picker-new';
            newBtn.textContent = '➕ 在此新建文件夹';
            wrap.append(crumb, target, list, newBtn);

            function renderCrumb() {
                crumb.innerHTML = '';
                const add = (label, to, cur) => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'crumb' + (cur ? ' current' : '');
                    b.textContent = label;
                    b.addEventListener('click', () => { path = to; refresh(); });
                    crumb.appendChild(b);
                };
                add('全部', '', path === '');
                const segs = path ? path.split('/') : [];
                segs.forEach((s, i) => {
                    const sep = document.createElement('span');
                    sep.className = 'sep';
                    sep.textContent = '/';
                    crumb.appendChild(sep);
                    add(s, segs.slice(0, i + 1).join('/'), i === segs.length - 1);
                });
            }

            function renderList(folders) {
                target.innerHTML = '';
                const strong = document.createElement('b');
                strong.textContent = path || '根目录 / 未分类';
                target.append('移动到：', strong);

                list.innerHTML = '';
                if (!folders.length) {
                    const empty = document.createElement('div');
                    empty.className = 'picker-empty';
                    empty.textContent = '此目录下暂无子文件夹，可直接移动到此处';
                    list.appendChild(empty);
                    return;
                }
                folders.forEach(f => {
                    const row = document.createElement('button');
                    row.type = 'button';
                    row.className = 'picker-item';
                    const icon = document.createElement('span'); icon.className = 'picker-icon'; icon.textContent = '📁';
                    const name = document.createElement('span'); name.className = 'picker-name'; name.textContent = f.name;
                    const count = document.createElement('span'); count.className = 'picker-count'; count.textContent = f.count + ' 项';
                    const go = document.createElement('span'); go.className = 'picker-go'; go.textContent = '进入 ›';
                    row.append(icon, name, count, go);
                    row.addEventListener('click', () => { path = f.path; refresh(); });
                    list.appendChild(row);
                });
            }

            async function refresh() {
                renderCrumb();
                const params = new URLSearchParams({ type: state.tab, folder: path, sort: 'name', order: 'asc', category: 'all' });
                try {
                    const res = await fetch('/api/list?' + params.toString());
                    const data = await res.json();
                    renderList(data.folders || []);
                } catch (err) {
                    renderList([]);
                }
            }

            newBtn.addEventListener('click', async () => {
                const name = await promptDialog({
                    title: '新建文件夹',
                    label: '将创建在：' + (path || '根目录 / 未分类'),
                    placeholder: '文件夹名称',
                    validate: v => v ? '' : '名称不能为空'
                });
                if (name === null) return;
                const created = path ? path + '/' + name : name;
                const res = await fetch('/api/folder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: state.tab, folder: created })
                });
                if (res.ok) await refresh();
                else { const d = await res.json().catch(() => ({})); toast('文件夹', d.error || '创建失败'); }
            });

            let layer;
            const footer = makeModalActions([
                { label: '取消', onClick: () => layer.finish(false) },
                { label: '移动到此处', cls: 'primary', onClick: () => layer.finish(path) }
            ]);
            // 成功回传选中的 path（可能是 '' 表示根），取消（含 Esc / 遮罩 / ×）回传 false → null。
            layer = openModalLayer({ title, body: wrap, footer, onClose: (r) => resolve(r === false ? null : r) });
            refresh();
        });
    }


    function humanSize(size) {
        const units = ['B', 'KB', 'MB', 'GB'];
        let value = Number(size) || 0;
        let index = 0;
        while (value >= 1024 && index < units.length - 1) {
            value /= 1024;
            index++;
        }
        return index === 0 ? `${value}${units[index]}` : `${value.toFixed(1)}${units[index]}`;
    }

    function dateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function formatDateLabel(date) {
        return date.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
    }

    function formatTime(value) {
        if (!value) return '';
        return new Date(value).toLocaleString();
    }

    function labelForCategory(category) {
        return {
            image: '图片',
            video: '视频',
            audio: '音频',
            document: '文档',
            archive: '压缩包',
            other: '其它'
        }[category] || category || '其它';
    }

    // 初始进入时按 URL hash 恢复到对应标签页/文件夹(支持直接分享 #clipboard 之类地址)
    applyRoute();
    if (!location.hash) history.replaceState(null, '', currentHash());
    bindPreviewZoom();
    loadAssets();
    connectWebSocket();
</script>
